<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#14080d">
    <title>Sign in — berrytone</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="gate">
    <main class="gate-card">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="brand-name">
          <strong>berrytone</strong>
          <small>listening room</small>
        </span>
      </div>
      <h1>Sign in</h1>
      <p>Use the name and password set up for you. The same pair works in Amperfy.</p>
      <form id="login-form">
        <label>
          Username
          <input id="username" name="username" autocomplete="username" required maxlength="200">
        </label>
        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200">
        </label>
        <p id="login-error" class="note" hidden></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
